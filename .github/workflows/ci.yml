name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # MySQL for the tests, same version as compose.yaml and AWS RDS.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w server

      - name: Tests
        run: npm run test:coverage -w server

      - name: Generate coverage badge
        run: |
          coverage=$(jq '.total.lines.pct' server/coverage/coverage-summary.json)
          color=$(awk -v c="$coverage" 'BEGIN { print (c < 80 ? "red" : "green") }')
          curl -sf "https://img.shields.io/badge/coverage-${coverage}%25-${color}" -o /tmp/coverage.svg

      - name: Push badge to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged"
          else
            git commit -m "Update coverage badge"
            git push origin badges
          fi

  push-image:
    name: Push server image to ECR
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Write config file
        env:
          DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node -e '
            const { DB_HOSTNAME, DB_USERNAME, DB_PASSWORD, RESEND_API_KEY } = process.env;
            const user = encodeURIComponent(DB_USERNAME);
            const password = encodeURIComponent(DB_PASSWORD);
            const config = {
              DATABASE_URL: `mysql://${user}:${password}@${DB_HOSTNAME}:3306/littleroots`,
              RESEND_API_KEY,
              APP_URL: "https://sims610.github.io/baby-name",
              CLIENT_ORIGINS: "https://sims610.github.io",
            };
            // Without a Resend key, the server prints emails to its log instead of sending them.
            const lines = Object.entries(config).filter(([, value]) => value).map(([key, value]) => `${key}="${value}"`);
            require("fs").writeFileSync("server/.env.production", lines.join("\n") + "\n");
          '

      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up machine emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v4

      - name: Build and push container image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/littleroots-service
        run: docker build --platform=linux/arm64 --provenance=false -t "$IMAGE:latest" --push .

      - name: Deploy new container
        run: aws ecs update-service --cluster littleroots-service --service littleroots-service --force-new-deployment

  deploy-client:
    name: Deploy client to GitHub Pages
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Build client
        env:
          VITE_API_URL: https://littleroots-service.byucanadian.click
        run: |
          npm ci
          npm run build -w client -- --base=/baby-name/
          cp client/dist/index.html client/dist/404.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: client/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
