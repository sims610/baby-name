name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # MySQL for the tests, same version as compose.yaml and AWS RDS.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql://root:rootpass@127.0.0.1:3306

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w server

      - name: Tests
        run: npm run test:coverage -w server

      - name: Generate coverage badge
        run: |
          coverage=$(jq '.total.lines.pct' server/coverage/coverage-summary.json)
          color=$(awk -v c="$coverage" 'BEGIN { print (c < 80 ? "red" : "green") }')
          curl -sf "https://img.shields.io/badge/coverage-${coverage}%25-${color}" -o /tmp/coverage.svg

      - name: Push badge to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged"
          else
            git commit -m "Update coverage badge"
            git push origin badges
          fi
