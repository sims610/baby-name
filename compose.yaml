# Local MySQL for development and tests. Start it with `docker compose up -d`.
# MySQL 8.4 matches what we'll run on AWS RDS. These passwords are for local use only.
services:
  mysql:
    image: mysql:8.4
    container_name: littleroots-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: littleroots
      MYSQL_USER: littleroots
      MYSQL_PASSWORD: devpass
    volumes:
      - littleroots-mysql:/var/lib/mysql # data survives container restarts
      - ./server/db/init:/docker-entrypoint-initdb.d:ro # runs once, when the volume is first created
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  littleroots-mysql:
